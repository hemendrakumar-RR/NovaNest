# ==============================================================================
# NovaNest Nginx Reverse Proxy & Static Asset Server Configuration
# ==============================================================================

# Rate Limiting Zones (DDoS and brute-force mitigation)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=ai_stream_limit:10m rate=10r/s;
limit_req_status 429;

upstream api_backend {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;

    # Root directory for React compiled SPA
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Client Request Limits
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # --------------------------------------------------------------------------
    # Health Check Endpoint
    # --------------------------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # Backend REST API & Real-Time SSE Reverse Proxy
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general_limit burst=30 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Standard Proxy & W3C Distributed Tracing Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header x-trace-id $http_x_trace_id;
        proxy_set_header x-request-id $http_x_request_id;

        # Timeouts for Long-Running AI Queries
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Intercept backend errors for custom presentation if desired
        proxy_intercept_errors off;
    }

    # --------------------------------------------------------------------------
    # Dedicated SSE Streaming Proxy (No Buffering, Unlimited Read Timeout)
    # --------------------------------------------------------------------------
    location ~* ^/api/ai/(ask/stream|stream) {
        limit_req zone=ai_stream_limit burst=10 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # SSE Required Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Disable all proxy-level buffering for instant SSE chunk streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long read timeouts to maintain persistent SSE telemetry streams
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching
    # --------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # React Single Page Application Client-Side Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
