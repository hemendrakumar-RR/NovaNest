# ==============================================================================
# NovaNest Public Cloud Nginx Edge Reverse Proxy (Production Configuration)
# Features: Let's Encrypt ACME Webroot, Modern TLS 1.2/1.3, HSTS, Rate Limiting,
#           W3C Distributed Tracing, React SPA Routing, Streamlit WebSocket,
#           and Authenticated Grafana Telemetry.
# ==============================================================================

# Rate Limiting Zones (DDoS and brute-force mitigation)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=ai_stream_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_status 429;

# Upstream Backend Clusters (Internal Docker Network)
upstream api_backend {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream streamlit_backend {
    server streamlit:8501 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream grafana_backend {
    server grafana:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server — Port 80 (ACME Challenge & Permanent HTTPS Redirection)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Let's Encrypt / Certbot Webroot ACME Verification Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health Check Endpoint on Port 80 (For VPS Cloud Health Probes)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Permanent 301 Redirect to HTTPS for all application traffic
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Port 443 (Production TLS Termination & Gateway)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    server_tokens off;

    # SSL Certificate Configuration (Let's Encrypt Live or Bootstrap Fallback)
    ssl_certificate /etc/letsencrypt/live/novanest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novanest.example.com/privkey.pem;

    # Mozilla Modern Profile TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS — 1 Year + Preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

    # Root Directory for Compiled React Single Page Application
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression Architecture
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Health Check Endpoint on HTTPS
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # A. FastAPI Backend REST API Gateway
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general_limit burst=30 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Standard Forwarding & W3C Distributed Tracing Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header x-trace-id $http_x_trace_id;
        proxy_set_header x-request-id $http_x_request_id;

        # Timeouts for Complex Multi-Agent Queries
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_intercept_errors off;
    }

    # --------------------------------------------------------------------------
    # B. Dedicated Real-Time Server-Sent Events (SSE) AI Streaming Endpoint
    # --------------------------------------------------------------------------
    location ~* ^/api/ai/(ask/stream|stream) {
        limit_req zone=ai_stream_limit burst=10 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Crucial for SSE: Zero buffering, chunked transfer, persistent connection
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # C. Streamlit Analytics Multipage Dashboard (Reverse Proxy with WebSocket)
    # --------------------------------------------------------------------------
    location ^~ /analytics/ {
        proxy_pass http://streamlit_backend/analytics/;
        proxy_http_version 1.1;

        # WebSocket & Session Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # D. Grafana Telemetry Dashboard (Authenticated Reverse Proxy)
    # --------------------------------------------------------------------------
    location ^~ /grafana/ {
        proxy_pass http://grafana_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # E. Static Asset Caching (Vite Output)
    # --------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # F. React Single Page Application (Client-Side HTML5 History Mode)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
