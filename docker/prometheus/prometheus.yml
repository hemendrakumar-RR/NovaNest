# ==============================================================================
# NovaNest Platform — Prometheus Server Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Gateway & Multi-Agent Observability Metrics
  # ----------------------------------------------------------------------------
  - job_name: "novanest-api"
    metrics_path: "/api/metrics"
    scheme: "http"
    authorization:
      type: "Bearer"
      credentials: "test-admin-key-phase06-8"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "novanest-api"
          tier: "backend"
          environment: "production"

  # ----------------------------------------------------------------------------
  # 2. Prometheus Self-Monitoring
  # ----------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          tier: "observability"
