# ==============================================================================
# NovaNest Platform — Multi-Service Docker Compose (Development & Testing)
# Architecture: React (Nginx) -> FastAPI -> MySQL 8.0 & Streamlit
# ==============================================================================

name: novanest-platform

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8.0 Relational Database Engine
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0.46
    container_name: novanest-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: novanest_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_secret_change_me}
      MYSQL_USER: ${DB_APP_USER:-novanest_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - novanest_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # Security: Database is NOT exposed publicly to the host network
    # Uncomment only for direct external debugging tools (e.g. Workbench):
    # ports:
    #   - "127.0.0.1:3306:3306"
    networks:
      - novanest_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend & Multi-Agent Intelligence Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: novanest-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATA_SOURCE: ${DATA_SOURCE:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-novanest_db}
      DB_APP_USER: ${DB_APP_USER:-novanest_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      NOVANEST_API_KEY: ${NOVANEST_API_KEY:-dev_novanest_api_key_default}
      NOVANEST_ADMIN_KEY: ${NOVANEST_ADMIN_KEY:-dev_novanest_admin_key_default}
      NOVANEST_VIEWER_KEY: ${NOVANEST_VIEWER_KEY:-dev_novanest_viewer_key_default}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    networks:
      - novanest_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 3. React SPA Frontend & Nginx Edge Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE: /api
    container_name: novanest-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    networks:
      - novanest_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ----------------------------------------------------------------------------
  # 4. Streamlit Multipage Executive Dashboard
  # ----------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: novanest-streamlit
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NOVANEST_API_URL: http://api:8000
      DATA_SOURCE: ${DATA_SOURCE:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-novanest_db}
      DB_APP_USER: ${DB_APP_USER:-novanest_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      NOVANEST_API_KEY: ${NOVANEST_API_KEY:-dev_novanest_api_key_default}
    ports:
      - "${STREAMLIT_HOST_PORT:-8502}:8501"
    networks:
      - novanest_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

# ==============================================================================
# Isolated Networks & Persistent Volumes
# ==============================================================================
networks:
  novanest_net:
    driver: bridge
    name: novanest_network

volumes:
  novanest_mysql_data:
    driver: local
    name: novanest_db_volume
