# ==============================================================================
# NovaNest Platform — Production Observability Extension (Prometheus + Grafana)
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# ==============================================================================

name: novanest-platform

services:
  # ----------------------------------------------------------------------------
  # 1. Prometheus Time-Series Metrics & Alerting Engine
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: novanest-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - novanest_prometheus_data:/prometheus
    ports:
      # Internal monitoring port (bind to localhost on host)
      - "127.0.0.1:9090:9090"
    networks:
      - novanest_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 2. Grafana Operations & Executive Telemetry Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: novanest-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-NovaNestSreGrafana2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - novanest_grafana_data:/var/lib/grafana
    ports:
      # Internal dashboard port (bind to localhost on host)
      - "127.0.0.1:3001:3000"
    networks:
      - novanest_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

volumes:
  novanest_prometheus_data:
    driver: local
  novanest_grafana_data:
    driver: local

networks:
  novanest_net:
    name: novanest_network
    driver: bridge
