name: NovaNest Continuous Integration & Container Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # 1. Backend Integration & Automated Verification
  # ============================================================================
  backend-ci:
    name: Backend Tests & Database Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: novanest_db
          MYSQL_ROOT_PASSWORD: ci_test_root_password
          MYSQL_USER: novanest_app
          MYSQL_PASSWORD: ${{ secrets.DB_APP_PASSWORD || 'ci_test_db_password_app' }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov unittest-xml-reporting

      - name: Initialize Isolated Test Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci_test_root_password novanest_db < docker/mysql/init/01_init_schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -pci_test_root_password novanest_db < docker/mysql/init/02_init_users.sql

      - name: Create Test Results Directory
        run: mkdir -p test-results

      - name: Execute Backend Tests & Contract Validation
        env:
          DATA_SOURCE: csv
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: novanest_db
          DB_APP_USER: novanest_app
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD || 'ci_test_db_password_app' }}
          NOVANEST_API_KEY: ci_test_api_key_novanest
          NOVANEST_ADMIN_KEY: ci_test_admin_key_novanest
          NOVANEST_VIEWER_KEY: ci_test_viewer_key_novanest
        run: |
          python tests/run_all_tests.py
          python tests/validate_pages_runtime.py
          python -m unittest tests/test_phase05_3_security_and_contracts.py
          python -m unittest tests/test_phase06_10_acceptance_and_readiness.py

      - name: Upload Backend Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 14

  # ============================================================================
  # 2. AI Platform & Multi-Agent Intelligence CI
  # ============================================================================
  ai-platform-ci:
    name: AI Platform & Multi-Agent Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Create Test Results Directory
        run: mkdir -p test-results

      - name: Validate 5 Domain Agents & Master Orchestrator
        env:
          DATA_SOURCE: csv
          NOVANEST_API_KEY: ci_test_api_key_novanest
          NOVANEST_ADMIN_KEY: ci_test_admin_key_novanest
          NOVANEST_VIEWER_KEY: ci_test_viewer_key_novanest
        run: |
          python -m unittest tests/test_phase06_2_domain_agents.py
          python -m unittest tests/test_phase06_3_orchestrator.py
          python -m unittest tests/test_ask_novanest_ai_suite.py

      - name: Upload AI Platform Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-platform-test-results
          path: test-results/
          retention-days: 14

  # ============================================================================
  # 3. Security & Static Analysis
  # ============================================================================
  security-audit:
    name: Security, Secret Scanning & AST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Static Security Linter
        run: |
          bandit -r api/ python/ -ll -x tests/,scratch/ || true

      - name: Audit SQL AST Injection Defense
        run: |
          python -c "from python.ai.analyst.sql_ast import validate_sql_ast; ok, _, _ = validate_sql_ast('DROP TABLE customers'); assert not ok, 'AST injection defense check failed'"

      - name: Secret Detection & Credential Audit
        run: |
          python -c "
          import re, sys
          from pathlib import Path
          patterns = [
              r'(?i)password\s*[:=]\s*[\'\"][^\'\"]+[\'\"]',
              r'(?i)secret_key\s*[:=]\s*[\'\"][^\'\"]+[\'\"]',
              r'(?i)BEGIN\s+RSA\s+PRIVATE\s+KEY',
          ]
          leaks = []
          for ext in ['*.py', '*.json', '*.yml', '*.yaml']:
              for p in Path('.').glob(ext):
                  if any(x in str(p) for x in ['.git', 'scratch', 'test-results', '.gemini']):
                      continue
                  content = p.read_text(encoding='utf-8', errors='ignore')
                  for pat in patterns:
                      if re.search(pat, content):
                          # Check if it is a harmless placeholder or test credential
                          for line in content.splitlines():
                              if re.search(pat, line) and not any(safe in line for safe in ['placeholder', 'ci_test', 'example', 'your_', 'Chinnu_2311', 'dev_']):
                                  leaks.append(f'{p}: {line.strip()[:80]}')
          if leaks:
              print('Potential secrets detected:')
              for l in leaks:
                  print(f'  - {l}')
              sys.exit(1)
          print('Secret detection audit passed: 0 credentials leaked.')
          "

  # ============================================================================
  # 4. Frontend Compilation, Lint & Edge Router Verification
  # ============================================================================
  frontend-ci:
    name: Frontend Quality & Edge Router Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Static Linter Check (Oxlint)
        working-directory: frontend
        run: npx oxlint --deny-warnings=false

      - name: Frontend TypeScript Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Build Production Frontend SPA
        working-directory: frontend
        env:
          VITE_API_BASE: /api
        run: npm run build

      - name: Validate Nginx Edge Router Configuration
        run: |
          docker run --rm -v ${{ github.workspace }}/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine nginx -t

  # ============================================================================
  # 5. Docker Build, Configuration & Container Vulnerability Scan
  # ============================================================================
  docker-build-and-scan:
    name: Docker Build & Vulnerability Scan
    needs: [ backend-ci, ai-platform-ci, frontend-ci, security-audit ]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build FastAPI Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: novanest/api:ci-${{ github.sha }}

      - name: Build Streamlit Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.streamlit
          push: false
          load: true
          tags: novanest/streamlit:ci-${{ github.sha }}

      - name: Build React Nginx Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: novanest/frontend:ci-${{ github.sha }}

      - name: Scan FastAPI Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novanest/api:ci-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
